# 4 GB heap: leaves room for the emulator on this 16 GB machine.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Two workers leave CPU for the Android emulator on this 4-core machine.
org.gradle.workers.max=2
